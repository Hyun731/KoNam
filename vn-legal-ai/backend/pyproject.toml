[project]
name = "vn-legal-ai-backend"
version = "0.1.0"
description = "베트남 법률 RAG / GraphRAG 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "openai>=1.99",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# 베트남어 복합어 분리(hợp_đồng). 없으면 음절 단위로 토큰화한다.
vi-nlp = ["pyvi>=0.1.1"]
# 로컬 크로스인코더 리랭커 (bge-reranker-v2-m3)
rerank = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]
# Hugging Face 법령 데이터셋에서 코퍼스 추출 (python -m ingest hf-export)
dataset = ["pandas>=2.2", "pyarrow>=16"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingest*", "eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI의 Depends/Query 기본값 패턴
ignore = ["B008", "E501", "B905"]
